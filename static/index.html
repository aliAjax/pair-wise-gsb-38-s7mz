<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字幕本地化质检 · 句级签署</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1>影视字幕本地化质检</h1>
<p>复核签署绑定到<strong>每一句</strong>：确认时记录当时的文本与时间轴摘要，之后只有被改动的句子失效；
交付逐句核对当前摘要，任一句缺少有效签署都会列出句号并停止。</p>

<div class="card">
  <h2>身份与版本</h2>
  <div class="row-flex">
    <label>用户 <input id="user" value="alice"></label>
    <label>角色
      <select id="role">
        <option>owner</option><option>reviewer</option>
        <option>translator</option><option>timeline</option><option>admin</option>
      </select>
    </label>
    <label>版本 ID <input id="version" type="number" value="1" style="width:90px"></label>
    <button onclick="refresh()">刷新</button>
    <span id="versionStatus" class="muted"></span>
  </div>
</div>

<div class="card">
  <h2>逐句签署状态（重开页面仍可核对）</h2>
  <div id="banner"></div>
  <div id="readiness" class="muted"></div>
  <table>
    <thead><tr>
      <th style="width:52px">句号</th><th style="width:130px">时间轴 (ms)</th>
      <th>当前文本</th><th style="width:190px">签署状态 / 失效原因</th>
      <th style="width:60px">重签</th>
    </tr></thead>
    <tbody id="cueRows"><tr><td colspan="5">等待刷新…</td></tr></tbody>
  </table>
  <div class="row-flex" style="margin-top:10px">
    <button class="primary" id="btnBatch" onclick="batchApprove()">批量确认全部（幂等，可中断恢复）</button>
    <label class="muted">批次号
      <input id="batchId" placeholder="留空自动生成；重提交原样带回" style="width:280px">
    </label>
  </div>
</div>

<div class="card">
  <h2>录入 / 修改字幕（翻译保存）</h2>
  <textarea id="cue" rows="4">{"cue_index":1,"start_ms":1000,"end_ms":3000,"text":"海豹出现在冰面上","expected_revision":0}</textarea>
  <button onclick="saveCue()">保存字幕</button>
  <pre id="cueResult" hidden></pre>
</div>

<div class="card">
  <h2>时间点评论</h2>
  <div class="row-flex">
    <input id="time" type="number" value="1200" style="width:110px">
    <input id="comment" value="请复核这里的术语" style="width:320px">
    <button onclick="addComment()">添加评论</button>
  </div>
  <pre id="commentResult" hidden></pre>
</div>

<div class="card">
  <h2>状态流转</h2>
  <div class="row-flex">
    <button onclick="action('submit')">提交复核</button>
    <button class="primary" onclick="review('approve')">整版批准（逐句核对）</button>
    <button class="danger" onclick="review('reject')">退回修改</button>
    <button onclick="action('lock')">锁定</button>
    <button class="primary" onclick="action('deliver')">交付</button>
  </div>
  <pre id="stateResult" hidden></pre>
</div>

<script src="/static/app.js"></script>
</body>
</html>
